# pnpm >= 10 reads overrides here (package.json "pnpm" field is ignored).
# Keep in sync with the Dockerfile pnpm version (corepack prepare pnpm@11.10.0).
overrides:
  multer: '>=2.3.0'
  nodemailer: '>=9.1.0'
  deepmerge-ts: '>=8.0.0'
  tar: '>=7.5.21'
minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1130.0'
  - '@aws-sdk/s3-request-presigner@3.1130.0'
  - mailparser@3.9.24
  - nodemailer@10.0.3
allowBuilds:
  sharp: true
  tesseract.js: true
  zerox: false
